name: 接続性の切り分け

# GitHub のホストランナーから montbell へ到達できないことを確かめるための調査。
#
# 2026-08-11 の実行結果:
#   ランナーの出口 IP  172.184.213.225（Microsoft / 米国カリフォルニア）
#   DNS               webshop / www / montbell.jp いずれも 180.147.235.227 に解決できる
#   TCP 443 と 80     4 通りすべて接続タイムアウト（拒否ではなく無応答）
#   HTTP              montbell.com も含めて全滅
#
# DNS は引けるのに TCP が無応答なので、経路上ではなく相手側が国外・
# データセンターの IP を落としている。定期チェックをホストランナーに
# 載せられないのはこれが理由。
on:
  workflow_dispatch:

jobs:
  netcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ランナー自身の出口 IP と国
        continue-on-error: true
        run: curl -sS --max-time 20 https://ipinfo.io/json || echo "取得できず"

      - name: DNS 解決
        continue-on-error: true
        run: |
          for host in webshop.montbell.jp www.montbell.jp montbell.jp; do
            echo "--- ${host}"
            getent ahosts "${host}" || echo "解決できず"
          done

      - name: TCP 443 への到達性
        continue-on-error: true
        run: |
          for host in webshop.montbell.jp www.montbell.jp; do
            for port in 443 80; do
              echo "--- ${host}:${port}"
              timeout 12 bash -c "cat < /dev/null > /dev/tcp/${host}/${port}" \
                && echo "接続できた" || echo "接続できず"
            done
          done

      - name: HTTP 応答
        continue-on-error: true
        run: |
          for url in \
            "https://webshop.montbell.jp/goods/disp.php?product_id=2301257" \
            "https://webshop.montbell.jp/" \
            "https://www.montbell.jp/" \
            "https://www.montbell.com/" ; do
            echo "=== ${url}"
            curl -sS -o /dev/null --max-time 25 \
              -w "code=%{http_code} ip=%{remote_ip} time=%{time_total}s\n" \
              "${url}" || echo "失敗"
          done
