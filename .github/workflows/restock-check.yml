name: 再入荷チェック

on:
  # 30 分おき。cron は UTC 指定だが、この用途では時刻の意味は無いので気にしない。
  # 毎時 0 分ちょうどは実行が混み合って遅延しやすいため、少しずらしてある。
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
  push:
    paths:
      - watchlist.json
      - montbell_restock/**
      - .github/workflows/restock-check.yml

# 状態ファイルをコミットして戻すので、実行が重ならないようにする。
concurrency:
  group: restock-check
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 在庫を確認して、再入荷なら通知する
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Slack / Discord にも流したい場合はリポジトリの Secrets に設定する。
          RESTOCK_WEBHOOK_URL: ${{ secrets.RESTOCK_WEBHOOK_URL }}
        run: python -m montbell_restock.cli check

      - name: 状態の変化をコミットする
        if: always()
        run: |
          if git diff --quiet -- state/; then
            echo "状態に変化なし。コミットするものはありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "在庫状態を更新"
          git push
