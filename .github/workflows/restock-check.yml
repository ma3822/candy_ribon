name: 再入荷チェック（セルフホストランナー用）

# 注意: GitHub のホストランナー（ubuntu-latest 等）ではこのチェックは動かない。
# montbell 側が国外・データセンターの IP からの接続を落としているため、
# 443/80 いずれも接続タイムアウトになる。詳細は netcheck.yml と README を参照。
#
# 使うには、日本国内の回線につながったマシンをセルフホストランナーとして
# 登録したうえで、下の schedule のコメントを外す。
# 手元のマシンで完結させたいだけなら scripts/setup.sh のほうが簡単。

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "9,39 * * * *"

concurrency:
  group: restock-check
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 在庫を確認して、再入荷なら通知する
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESTOCK_WEBHOOK_URL: ${{ secrets.RESTOCK_WEBHOOK_URL }}
        run: python -m montbell_restock.cli check

      - name: 状態の変化をコミットする
        if: always()
        run: |
          if git diff --quiet -- state/; then
            echo "状態に変化なし。コミットするものはありません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "在庫状態を更新"
          git push
