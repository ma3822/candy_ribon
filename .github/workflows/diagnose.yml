name: 商品ページ構造の調査

# パーサを書く / 直すときに、実際の商品ページがどういう HTML なのかを
# ランナー上で実測するための手動ワークフロー。定期実行はしない。
on:
  workflow_dispatch:
    inputs:
      url:
        description: 調査する商品ページの URL
        required: false
        default: https://webshop.montbell.jp/goods/disp.php?product_id=2301257
      needles:
        description: 生 HTML 内で周辺を確認したい文字列（カンマ区切り）
        required: false
        default: LGY,XL

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 調査を実行
        run: |
          needle_args=""
          IFS=',' read -ra parts <<< "${{ inputs.needles }}"
          for part in "${parts[@]}"; do
            needle_args+=" --needle ${part}"
          done

          python -m montbell_restock.diagnose \
            "${{ inputs.url }}" \
            --save-html artifacts/page.html \
            ${needle_args}

      - name: HTML を成果物として保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-html
          path: artifacts/
          if-no-files-found: warn
